[project]
name = "qubit-notes-experiments"
version = "0.1.0"
description = "Experiments on the AI agents of Qubit Notes, apart from the app: prompt optimization first"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "langfuse>=5.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
qn-experiment = "qubit_notes_experiments.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qubit_notes_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features"
markers = [
    "real_models: calls real models, and costs money",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
